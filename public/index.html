<!doctype html>
<html lang="ro"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calorii">
<meta name="theme-color" content="#2e7d32">
<title>Calorii</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--g:#2e7d32;--g2:#a5d6a7;--bg:#f4f8f4;--card:#fff;--tx:#1b2b1c;--mut:#667a68;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:520px;margin:auto}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header img{width:36px;height:36px;border-radius:10px}
header h1{font-size:22px;margin:0}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:28px;line-height:1}.ring span{font-size:12px;color:var(--mut)}
.macros{flex:1;display:grid;gap:8px}
.m{display:flex;justify-content:space-between;font-size:14px}.m i{font-style:normal;color:var(--mut)}
.goal{margin-top:12px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.goal input[type=number]{width:96px;padding:6px 8px;font-size:14px;border-radius:10px}.goal{white-space:nowrap}
.pick{display:flex;gap:10px;margin-bottom:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--g);color:#fff}.btn.s{background:#e6f1e6;color:var(--g)}
#fileCam,#fileGal{display:none}
textarea,input[type=password],input[type=number]{width:100%;font-size:16px;padding:12px;border:1px solid #cfdccf;border-radius:14px;font-family:inherit}
textarea{resize:none;margin-bottom:10px}
#msg{font-size:14px;color:var(--mut);min-height:20px;margin-top:8px}.err{color:var(--err)!important}
.meal{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #edf2ed}
.meal:first-child{border-top:0}
.meal .n{font-weight:600}.meal .d{font-size:12px;color:var(--mut)}
.meal .k{font-weight:700;color:var(--g);margin:0 10px;white-space:nowrap}
.x{border:0;background:#f1f1f1;border-radius:10px;width:32px;height:32px;font-size:16px;cursor:pointer}
details{margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:14px}
.empty{color:var(--mut);font-size:14px}
small{color:var(--mut)}
</style></head><body><main>
<header><img src="/icon.svg" alt=""><h1>Calorii</h1></header>

<section class="card">
  <div class="ringwrap">
    <div class="ring">
      <svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="#e6f1e6" stroke-width="14"/><circle id="arc" cx="66" cy="66" r="56" fill="none" stroke="#2e7d32" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 352"/></svg>
      <div class="c"><b id="tot">0</b><span>kcal azi</span></div>
    </div>
    <div class="macros">
      <div class="m"><i>Proteine</i><b id="mp">0 g</b></div>
      <div class="m"><i>Grasimi</i><b id="mf">0 g</b></div>
      <div class="m"><i>Carbohidrati</i><b id="mc">0 g</b></div>
    </div>
  </div>
  <div class="goal">Tinta zilnica <input id="goal" type="number" inputmode="numeric" min="800" max="6000"> kcal</div>
</section>

<section class="card">
  <div class="pick">
    <label class="btn p" for="fileCam" style="text-align:center">Fa poza</label>
    <label class="btn p" for="fileGal" style="text-align:center">Din galerie</label>
    <input id="fileCam" type="file" accept="image/*" capture="environment">
    <input id="fileGal" type="file" accept="image/*">
  </div>
  <div id="chosen" class="empty" style="margin-bottom:10px"></div>
  <textarea id="desc" rows="2" placeholder="sau descrie mancarea (ex: 2 oua si paine)"></textarea>
  <button class="btn s" id="go" style="width:100%">Calculeaza</button>
  <div id="msg"></div>
</section>

<section class="card">
  <b>Azi</b>
  <div id="log"></div>
</section>

<details class="card"><summary>Setari si date</summary>
  <p><input id="code" type="password" placeholder="Cod aplicatie" autocomplete="off"></p>
  <div class="pick"><button class="btn s" id="exp">Export JSON</button><button class="btn s" id="imp">Import JSON</button></div>
  <input id="impf" type="file" accept="application/json" hidden>
</details>
<p><small>Estimarile sunt orientative, nu sfat medical.</small></p>
</main>
<script src="/app.js"></script>
</body></html>
