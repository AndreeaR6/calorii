<!doctype html>
<html lang="ro"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calorii</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;max-width:560px;margin:auto}
button,input,textarea{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}
.row{display:flex;gap:8px}.row>*{flex:1}
li{margin:6px 0}.tot{font-weight:bold;font-size:20px}
.err{color:#b00020}.small{color:#666;font-size:13px}
</style></head><body>
<h1>Calorii azi: <span id="tot">0</span> kcal</h1>
<div id="setup"><input id="code" placeholder="Cod aplicatie" type="password"></div>
<input id="file" type="file" accept="image/*" capture="environment">
<textarea id="desc" rows="2" placeholder="sau descrie mancarea (ex: 2 oua si paine)"></textarea>
<button id="go">Calculeaza</button>
<div id="msg" class="small"></div>
<div id="res"></div>
<h2>Jurnal</h2>
<ul id="log"></ul>
<div class="row"><button id="exp">Export JSON</button><button id="imp">Import JSON</button></div>
<input id="impf" type="file" accept="application/json" hidden>
<p class="small">Estimarile sunt orientative, nu sfat medical.</p>
<script src="/app.js"></script>
</body></html>
